# RAG evals в CI: на каждое изменение RAG-кода / промптов / тестсета прогоняем тестсет
# и падаем, если метрика ниже порога (пороги — THRESHOLDS в src/rag/evals.py).
# Индекс (data/processed/) закоммичен, поэтому эмбеддинги корпуса в CI не пересчитываются.
name: rag-evals

on:
  push:
    branches: [main]
    paths:
      - "src/rag/**"
      - "prompts/rag/**"
      - "data/rag_testset.jsonl"
      - "data/processed/**"
      - ".github/workflows/rag-evals.yml"
  pull_request:
    paths:
      - "src/rag/**"
      - "prompts/rag/**"
      - "data/rag_testset.jsonl"
  workflow_dispatch:          # ручной запуск из вкладки Actions

concurrency:                  # не запускать два прогона параллельно: общая квота free tier
  group: rag-evals
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RAG evals
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.rag.evals --ci

      - name: Upload results
        if: always()          # отчёт нужен и при провале — чтобы увидеть, что упало
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-results
          path: results/rag/
